[package]
name = "cloudflare-ddns"
version = "0.1.1"
edition = "2024"
description = "A lightweight Cloudflare Dynamic DNS client for Linux"
license = "MIT"
readme = "README.md"
repository = "https://github.com/h3jfc/cloudflare-ddns"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
